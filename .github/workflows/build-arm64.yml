name: Build ARM64 backends

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assistance/**"
      - "auth/**"
      - "backoffice/**"
      - "project-assistance/**"
      - "astc-cn-notifications/**"
      - ".github/workflows/build-arm64.yml"

# ubuntu-24.04-arm es el runner ARM nativo de GitHub. Gratis en repos publicos.
# Compila nativamente: cero emulacion QEMU, que es lo que hacia fallar Maven en local.
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build:
    name: build-${{ matrix.service }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: assistance
            image: assistance-service
          - service: auth
            image: auth-service
          - service: backoffice
            image: backoffice-service
          - service: project-assistance
            image: project-assistance-service
          - service: astc-cn-notifications
            image: cn-notifications

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalizar usuario a lowercase
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=$owner" >> "$GITHUB_ENV"

      - name: Autenticar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/astc-arm-build/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # El paquete GHCR es privado y los nodos ARM del cluster no pueden
      # autenticarse, asi que ademas de publicar en GHCR se exporta un tar
      # como artefacto para importarlo con `ctr images import` en el nodo.
      - name: Exportar tar de la imagen (notifications)
        if: matrix.service == 'astc-cn-notifications'
        run: |
          IMG="ghcr.io/${{ env.IMAGE_PREFIX }}/astc-arm-build/${{ matrix.image }}:latest"
          docker pull "$IMG"
          docker save "$IMG" | gzip -1 > cn-notifications-arm64.tar.gz
          ls -lh cn-notifications-arm64.tar.gz

      - name: Subir artefacto
        if: matrix.service == 'astc-cn-notifications'
        uses: actions/upload-artifact@v4
        with:
          name: cn-notifications-arm64
          path: cn-notifications-arm64.tar.gz
          retention-days: 7
