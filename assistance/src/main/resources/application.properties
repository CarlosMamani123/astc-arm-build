# =============================================================================
# SMMS Assistance Service - Configuration
# =============================================================================
quarkus.application.name=smms-assistance-service
quarkus.http.port=8082

# =============================================================================
# DATABASE
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:assistance_user}
quarkus.datasource.password=${DB_PASSWORD:assistance_password}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:astc_assistance}}
quarkus.datasource.jdbc.max-size=${DB_POOL_SIZE:10}
quarkus.datasource.jdbc.acquisition-timeout=${DB_ACQUISITION_TIMEOUT:60s}
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.database.version=16
quarkus.hibernate-orm.jdbc.statement-batch-size=50

# =============================================================================
# FLYWAY
# =============================================================================

# =============================================================================
# JWT (RS256)
# =============================================================================
quarkus.smallrye-jwt.enabled=true
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=better-auth-verify

# =============================================================================
# SECURITY RULES
# =============================================================================
quarkus.http.auth.permission.authenticated.paths=/rest/secure/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.http.auth.permission.public.paths=/graphql,/q/*
quarkus.http.auth.permission.public.policy=permit

# =============================================================================
# GRAPHQL
# =============================================================================
quarkus.smallrye-graphql.ui.always-include=true
quarkus.smallrye-graphql.root-path=/graphql
quarkus.smallrye-graphql.federation.enabled=true
quarkus.smallrye-graphql.print-data-fetcher-exception=true
mp.graphql.showErrorMessage=java.lang.RuntimeException

# =============================================================================
# S3 / MINIO
# =============================================================================
app.storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.storage.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:9010}
app.storage.access-key=${S3_ACCESS_KEY:minioadmin}
app.storage.secret-key=${S3_SECRET_KEY:minioadmin}
app.storage.region=${S3_REGION:us-east-1}
app.storage.bucket=${S3_BUCKET:assistance}

# =============================================================================
# ATTENDANCE CLASSIFICATION
# =============================================================================
app.attendance.absence-cutoff-hour=9
app.attendance.absence-cutoff-minute=30
app.attendance.default-timezone=${APP_DEFAULT_TIMEZONE:America/Lima}

# =============================================================================
# ABSENCE GENERATION JOB (CRON)
# =============================================================================
app.absence.job.cron=${ABSENCE_JOB_CRON:0 0 10 * * ?}
app.absence.job.cutoff-hour=${ABSENCE_CUTOFF_HOUR:9}
app.absence.job.cutoff-minute=${ABSENCE_CUTOFF_MINUTE:30}
app.absence.job.default-timezone=${ABSENCE_JOB_TIMEZONE:America/Lima}

# =============================================================================
# REDIS
# =============================================================================
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

# =============================================================================
# RABBITMQ
# =============================================================================
quarkus.rabbitmq.devservices.enabled=false
mp.messaging.outgoing.notification-events.connector=smallrye-rabbitmq
mp.messaging.outgoing.notification-events.exchange.name=email.notification
mp.messaging.outgoing.notification-events.exchange.type=direct
mp.messaging.outgoing.notification-events.exchange.declare=true
mp.messaging.outgoing.notification-events.default-routing-key=email.notification
mp.messaging.connector.smallrye-rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
mp.messaging.connector.smallrye-rabbitmq.port=${RABBITMQ_PORT:5672}
mp.messaging.connector.smallrye-rabbitmq.username=${RABBITMQ_USER:guest}
mp.messaging.connector.smallrye-rabbitmq.password=${RABBITMQ_PASS:guest}

# =============================================================================
# NOTIFICATION TEMPLATE MAPPING
# =============================================================================
event.notification.template.attendance_registered=${EVENT_NOTIFICATION_TEMPLATE_ATTENDANCE:AST00001}
event.notification.template.attendance_early=${EVENT_NOTIFICATION_TEMPLATE_ATTENDANCE_EARLY:AST00002}
event.notification.template.attendance_late=${EVENT_NOTIFICATION_TEMPLATE_ATTENDANCE_LATE:AST00003}
event.notification.template.attendance_outside_hours=${EVENT_NOTIFICATION_TEMPLATE_ATTENDANCE_OUTSIDE:AST00004}
event.notification.template.absence_late=${EVENT_NOTIFICATION_TEMPLATE_ABSENCE_LATE:AST00005}
event.notification.template.absence_late_pm=${EVENT_NOTIFICATION_TEMPLATE_ABSENCE_LATE_PM:AST00006}
event.notification.template.absence_no_record=${EVENT_NOTIFICATION_TEMPLATE_ABSENCE_NO_RECORD:AST00007}
event.notification.template.absence_no_record_pm=${EVENT_NOTIFICATION_TEMPLATE_ABSENCE_NO_RECORD_PM:AST00008}
event.notification.template.checkout_registered=${EVENT_NOTIFICATION_TEMPLATE_CHECKOUT:AST00009}
event.notification.template.attendance_early=${EVENT_NOTIFICATION_TEMPLATE_ATTENDANCE_EARLY:AST00010}
event.notification.template.absence_early_checkout=${EVENT_NOTIFICATION_TEMPLATE_ABSENCE_EARLY_CHECKOUT:AST00011}
event.notification.template.justification_submitted=${EVENT_NOTIFICATION_TEMPLATE_JUSTIFICATION_SUBMITTED:AST00012}
event.notification.template.justification_received=${EVENT_NOTIFICATION_TEMPLATE_JUSTIFICATION_RECEIVED:AST00013}
event.notification.template.justification_resubmitted=${EVENT_NOTIFICATION_TEMPLATE_JUSTIFICATION_RESUBMITTED:AST00014}
event.notification.template.SendNotificationByQueue=${EVENT_NOTIFICATION_TEMPLATE_JUSTIFICATION:AST00012}

# =============================================================================
# OPENTELEMETRY
# =============================================================================
quarkus.otel.enabled=${OTEL_ENABLED:false}
quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=smms-assistance-service

# =============================================================================
# VERTX (Event Loop)
# =============================================================================
quarkus.vertx.max-event-loop-execute-time=60s

# =============================================================================
# LOGGING
# =============================================================================
quarkus.log.level=INFO

# =============================================================================
# CORS
# =============================================================================
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.access-control-allow-credentials=true
%prod.quarkus.http.cors.enabled=true
%prod.quarkus.http.cors.origins=/.*/
%prod.quarkus.http.cors.methods=GET,POST,OPTIONS
%prod.quarkus.http.cors.headers=Content-Type,Authorization
%prod.quarkus.http.cors.access-control-allow-credentials=true

# =============================================================================
# PROJECT MANAGER CLIENT
# =============================================================================
quarkus.smallrye-graphql-client.project-manager-service.url=${PROJECT_MANAGER_URL:http://astc-svc-backend-project-assistance-service.astc-app.svc.cluster.local:8082/graphql}
quarkus.smallrye-graphql-client.auth-service.url=${AUTH_SERVICE_URL:http://astc-svc-auth-auth-service.astc-app.svc.cluster.local:8082/graphql}
app.alerts.url=${ALERTS_URL:http://astc-svc-worker-alerts-service.astc-app.svc.cluster.local:8080/api/analyze-attendance}

# REDIS CACHE
quarkus.cache.redis.my_projects.expire-after-write=30s
quarkus.cache.redis.my_projects.prefix=assistance:my-projects:
quarkus.cache.redis.my_projects.key-type=java.lang.String
quarkus.cache.redis.my_projects.value-type=com.smms.assistance.infrastructure.client.ProjectOutputListWrapper

quarkus.log.category."io.smallrye.health".level=WARN
