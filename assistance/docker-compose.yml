name: astc-assistance   # ← Esto evita conflictos de nombres

version: "3.9"

services:

  assistance-service:
    build: ./services/assistance          # ← Correcto (apunta al submodule)
    container_name: astc-assistance-service
    ports:
      - "8082:8082"
    env_file:
      - ./services/assistance/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - astc-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: astc-assistance-postgres
    environment:
      POSTGRES_DB: assistance_db
      POSTGRES_USER: assistance_user
      POSTGRES_PASSWORD: assistance_pass
    ports:
      - "5434:5432"
    volumes:
      - assistance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistance_user -d assistance_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - astc-network

  redis:
    image: redis:7-alpine
    container_name: astc-assistance-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - astc-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: astc-assistance-rabbitmq
    ports:
      - "5674:5672"
      - "15674:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - astc-network

  minio:
    image: minio/minio:latest
    container_name: astc-assistance-minio
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - assistance_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astc-network

volumes:
  assistance_pgdata:
  assistance_miniodata:

networks:
  astc-network:
    driver: bridge