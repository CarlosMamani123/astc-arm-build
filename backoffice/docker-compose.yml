version: "3.9"

services:

  backoffice-service:
    build:
      context: .
    container_name: astc-cn-backend-backoffice-service-2
    ports:
      - "8084:8082"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - astc-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: astc-backoffice-postgres-2
    environment:
      POSTGRES_DB: backoffice_db
      POSTGRES_USER: backoffice_user
      POSTGRES_PASSWORD: backoffice_pass
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backoffice_user -d backoffice_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - astc-network

volumes:
  pgdata:

networks:
  astc-network:
    driver: bridge