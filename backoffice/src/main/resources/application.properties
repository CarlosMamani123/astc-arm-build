# =========================
# APP
# =========================
quarkus.application.name=backoffice-service

# =========================
# HTTP
# =========================
quarkus.http.port=8082

# =========================
# SECURITY
# =========================
quarkus.http.auth.proactive=true

# 🔐 SOLO endpoints REST seguros
quarkus.http.auth.permission.authenticated.paths=/rest/secure/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# 🌍 Público para Apollo Federation + endpoints internos
quarkus.http.auth.permission.public.paths=/graphql,/q/*
quarkus.http.auth.permission.public.policy=permit

# =========================
# JWT (RS256)
# =========================
quarkus.smallrye-jwt.enabled=true
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=better-auth-verify
quarkus.log.category."io.quarkus.security".level=INFO
quarkus.log.category."io.smallrye.jwt".level=INFO

# =========================
# AUTH SERVICE CLIENT
# =========================
quarkus.smallrye-graphql-client.auth-service.url=${AUTH_SERVICE_URL:http://astc-svc-auth-auth-service.astc-app.svc.cluster.local:8082/graphql}
quarkus.smallrye-graphql-client.auth-service.log-payload=true

# =========================
# DATABASE (backoffice)
# =========================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:backoffice_user}
quarkus.datasource.password=${DB_PASSWORD:backoffice_password}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:astc_backoffice}}
quarkus.datasource.jdbc.max-size=${DB_POOL_SIZE:10}
quarkus.datasource.jdbc.acquisition-timeout=${DB_ACQUISITION_TIMEOUT:60s}
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.packages=com.backoffice.backoffice.domain.entity,com.backoffice.shared.domain
quarkus.hibernate-orm.database.version=16
quarkus.hibernate-orm.jdbc.statement-batch-size=50

# =========================
# DATABASE (notification - app database)
# =========================
quarkus.datasource.notifications.db-kind=postgresql
quarkus.datasource.notifications.username=${NOTIFICATION_DB_USERNAME:backoffice_user}
quarkus.datasource.notifications.password=${NOTIFICATION_DB_PASSWORD:backoffice_password}
quarkus.datasource.notifications.jdbc.url=${NOTIFICATION_DB_JDBC_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:astc_backoffice}}
quarkus.hibernate-orm."notifications".datasource=notifications
quarkus.hibernate-orm."notifications".packages=io.mindoracare.notification
quarkus.hibernate-orm."notifications".database.generation=none

# =========================
# GRAPHQL
# =========================
quarkus.smallrye-graphql.ui.enable=true
quarkus.smallrye-graphql.root-path=/graphql
quarkus.smallrye-graphql.ui.always-include=true
quarkus.smallrye-graphql.schema-include-directives=true
quarkus.smallrye-graphql.schema-include-schema-definition=true
quarkus.smallrye-graphql.federation.enabled=true
quarkus.smallrye-graphql.print-data-fetcher-exception=true
mp.graphql.showErrorMessage=java.lang.RuntimeException

# =========================
# CORS
# =========================
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# =========================
# STORAGE (MINIO / S3)
# =========================
storage.bucket.name=backoffice
quarkus.s3.endpoint-override=${S3_ENDPOINT:http://minio:9000}
quarkus.s3.aws.region=${S3_REGION:us-east-1}
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY:minioadmin}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_KEY:minioadmin}
quarkus.s3.path-style-access=true

# =========================
# RABBITMQ
# =========================
quarkus.rabbitmq-host=${RABBITMQ_HOST:rabbitmq}
quarkus.rabbitmq-port=${RABBITMQ_PORT:5672}
quarkus.rabbitmq.username=${RABBITMQ_USERNAME:guest}
quarkus.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# user-events exchange already exists as 'fanout' in RabbitMQ; the connector default
# (topic + declare) raises a 406 and fails the liveness health check, restarting the pod.
mp.messaging.outgoing.user-events.exchange.type=fanout
mp.messaging.outgoing.user-events.exchange.name=user-events
mp.messaging.outgoing.user-events.exchange.declare=false

# =========================
# FLYWAY
# =========================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# =========================
# LOGGING
# =========================
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.console.darken=1

# =========================
# DEV / TEST
# =========================
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false
quarkus.test.containers.enabled=false
